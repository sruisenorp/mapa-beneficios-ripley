<style>
/* Layout: barra superior con filtros, panel lateral "Cercano" a la izquierda y mapa a la derecha; cajón de beneficios online que se despliega sobre el mapa */
:root{
  --plum:#4b1f6f; --plum-2:#6b2f97; --plum-soft:#f1eaf7; --ink:#1d1424; --ink-2:#5d5168; --line:#e6dfec;
  --paper:#ffffff; --ground:#f7f4fa; --gold:#f2b705;
  --c-comida:#e2503b; --c-viajes:#1f7ac2; --c-bienestar:#c2378a; --c-entre:#2f9a62;
  --display:"Sora",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--ground);font-size:14px;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
header.top{background:var(--plum);color:#fff;padding:10px max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--plum);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.brand h1{font-family:var(--display);font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:12px;opacity:.75;font-family:var(--body);font-weight:500;letter-spacing:0}
.search{flex:1 1 320px;max-width:560px;position:relative}
.search input{width:100%;border:0;border-radius:999px;padding:11px 16px 11px 40px;background:#fff;color:var(--ink);font-size:15px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.55}
.top-actions{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.solid{background:#fff;color:var(--plum);border-color:#fff}
.btn:focus-visible,.chip:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--gold);color:var(--ink);font-size:12px;text-align:center}
.filters{background:var(--paper);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.sel{display:flex;gap:8px;flex-wrap:wrap}
.sel label{display:flex;flex-direction:column;font-size:11px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;gap:2px}
.sel select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--paper);min-width:120px;max-width:190px;font-size:13px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.reset{border:0;background:none;color:var(--plum-2);font-weight:700;cursor:pointer;text-decoration:underline;padding:4px}
main{flex:1;display:flex;min-height:0;position:relative}
aside.list{width:400px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.list-head h2{font-family:var(--display);font-size:16px;margin:0;font-weight:600}
.list-head{flex-wrap:wrap}.list-head .count{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.near{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--plum-soft);color:var(--plum);font-weight:700;font-size:12px;padding:5px 10px;cursor:pointer}
.items{overflow:auto;flex:1}
.item{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:36px 1fr;gap:4px 12px;cursor:pointer}
.item:hover,.item.active{background:var(--plum-soft)}
.badge{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display);font-size:14px;grid-row:span 3}
.item h3{margin:0;font-size:15px;font-weight:700;line-height:1.25}
.item .addr{font-size:13px;color:var(--ink-2);line-height:1.35}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.pill{background:var(--plum);color:#fff;border-radius:6px;padding:2px 8px;font-weight:700;font-size:12px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.tag.black{background:#111;color:#fff;border-color:#111}
.tag.today{background:#e8f6ee;color:#1d7a46;border-color:#bfe5cf}
.dist{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.more{padding:14px 18px;text-align:center;color:var(--ink-2);font-size:13px}
.more button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
#map{flex:1;min-width:0;background:#e9e6ee}
.empty{padding:28px 18px;color:var(--ink-2);line-height:1.5}
/* clusters */
.cl{background:transparent}
.cl div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display);background:#d62d20;box-shadow:0 0 0 6px rgba(214,45,32,.25)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:12px;font-family:var(--display)}
.leaflet-popup-content{margin:12px 14px;font-family:var(--body);font-size:13px;line-height:1.35;min-width:200px}
.pop h4{margin:0 0 6px;font-size:15px;font-family:var(--display)}
.pop .b{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:6px 0;border-top:1px solid var(--line)}
.pop .dto{font-size:15px;font-weight:800;color:var(--plum)}
.pop .dia{font-size:12px;font-weight:700;color:var(--ink);background:var(--chip,#f1ecf6);border-radius:999px;padding:2px 8px}
.pop .tg{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.pop .foot{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:12px;color:var(--ink-2)}
.pop a{color:var(--plum-2);font-weight:700}
/* online drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--paper);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(40,10,60,.12);z-index:1000;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s ease}
.drawer.open{transform:none}
.drawer header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.drawer h2{font-family:var(--display);font-size:17px;margin:0}
.drawer p.sub{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.drawer .x{margin-left:auto;border:0;background:var(--plum-soft);color:var(--plum);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.ocard{padding:14px 18px;border-bottom:1px solid var(--line)}
.ocard .row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ocard h3{margin:0;font-size:15px}
.ocard .desc{color:var(--ink-2);margin:6px 0;font-size:13px;line-height:1.4}
.ocard .code{font-family:ui-monospace,Menlo,monospace;background:var(--ground);border:1px dashed var(--plum-2);border-radius:6px;padding:2px 6px;font-size:12px}
.ocard a{color:var(--plum-2);font-weight:700;font-size:13px}
.cat-h{padding:10px 18px;background:var(--ground);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--line)}
.mobile-toggle{display:none}
@media (max-width:820px){
  aside.list{position:absolute;inset:0;width:auto;z-index:900;display:none}
  body.show-list aside.list{display:flex}
  .mobile-toggle{display:inline-flex}
  .brand h1{font-size:16px}
  .sel select{min-width:0;max-width:44vw}
  .top-actions{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
</head>

"Los Lagos","z":"Zona Sur","lat":-40.57311,"lon":-73.14222,"s":"Google Maps"},{"k":"aramco_osorno","n":"Aramco","a":"Av. Manuel Rodriguez 1562, local 1","c":"Osorno","ci":"Osorno","r":"Los Lagos","z":"Zona Sur","lat":-40.577554,"lon":-73.123228,"s":"Google Maps"}],"regions":["Arica y Parinacota","Tarapacá","Antofagasta","Atacama","Coquimbo","Valparaíso","Metropolitana","O'Higgins","Maule","Ñuble","Biobío","Araucanía","Los Ríos","Los Lagos","Aysén","Magallanes"],"generated":"2026-10-16"};</script>
<script>
(function(){
const D=window.BENEFICIOS_DATA;
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const CATS=[['Comida & Delivery','--c-comida'],['Viajes & Transporte','--c-viajes'],['Bienestar & Belleza','--c-bienestar'],['Entretención & Otros','--c-entre']];
const PROGS=['Restofans','Club Restofans','Black','Solo para ti'];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const catColor=c=>{const f=CATS.find(x=>x[0]===c);return css(f?f[1]:'--plum')};
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const todayIdx=(new Date().getDay()+6)%7;
// index benefits by merchant key
const byKey={};D.benefits.forEach(b=>{if(b.key&&b.fisico){(byKey[b.key]=byKey[b.key]||[]).push(b)}});
const locs=D.locations.filter(l=>byKey[l.k]);
locs.forEach((l,i)=>{l.id=i;l.cat=byKey[l.k][0].categoria;l.txt=norm([l.n,l.a,l.c,l.ci,l.r].join(' '))});
const online=D.benefits.filter(b=>b.online);
const st={cats:new Set(),progs:new Set(),dia:'',zona:'',reg:'',ciu:'',com:'',co:'',q:'',me:null,limit:60,sel:null};
// UI builders
const $=id=>document.getElementById(id);
function chip(label,color,set,val,host){const b=document.createElement('button');b.className='chip';b.type='button';b.setAttribute('aria-pressed','false');
  b.innerHTML=(color?`<span class="dot" style="background:${color}"></span>`:'')+esc(label);
  b.onclick=()=>{set.has(val)?set.delete(val):set.add(val);b.setAttribute('aria-pressed',set.has(val));st.limit=60;render()};host.appendChild(b)}
CATS.forEach(([c,v])=>chip(c,css(v),st.cats,c,$('cats')));
PROGS.forEach(p=>chip(p,null,st.progs,p,$('progs')));
const fDia=$('fDia');fDia.innerHTML='<option value="">Todos</option><option value="hoy">Hoy ('+DAYS[todayIdx]+')</option>'+DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('');
function opts(sel,vals,cur,all){sel.innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option${v===cur?' selected':''}>${esc(v)}</option>`).join('')}
function benOk(b){
  if(st.cats.size&&!st.cats.has(b.categoria))return false;
  if(st.progs.size&&!(b.tags||[]).some(t=>st.progs.has(t)))return false;
  if(st.dia!==''){const d=st.dia==='hoy'?todayIdx:+st.dia;if(!b.d.includes(d))return false}
  return true}
function geoOk(l,skip){
  if(skip!=='zona'&&st.zona&&l.z!==st.zona)return false;
  if(skip!=='reg'&&st.reg&&l.r!==st.reg)return false;
  if(skip!=='ciu'&&st.ciu&&l.ci!==st.ciu)return false;
  if(skip!=='com'&&st.com&&l.c!==st.com)return false;
  return true}
function textOk(l){if(!st.q)return true;return st.q.split(/\s+/).every(w=>l.txt.includes(w))}
function km(a,b){const R=6371,dLa=(b.lat-a.lat)*Math.PI/180,dLo=(b.lon-a.lon)*Math.PI/180;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
// map
const map=L.map('map',{zoomControl:true,preferCanvas:false}).setView([-33.44,-70.62],11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
const cluster=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:55,iconCreateFunction:c=>{const n=c.getChildCount();const s=n<10?36:n<100?42:50;return L.divIcon({html:`<div>${n}</div>`,className:'cl',iconSize:[s,s]})}});
map.addLayer(cluster);
const markers={};
function initials(n){return n.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function mk(l){const m=L.marker([l.lat,l.lon],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${catColor(l.cat)}"><span>${esc(initials(l.n))}</span></div>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]}),title:l.n});
  m.on('click',()=>{st.sel=l.id;m.setPopupContent(popup(l))});m.bindPopup(()=>popup(l),{maxWidth:320});return m}
function daysTxt(b){return b.d.length===7?'Todos los días':b.d.map(i=>DAYS[i]).join(', ')}
function gmaps(l){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(l.n+' '+l.a+', '+l.c+', Chile')}
function popup(l){const bs=byKey[l.k].filter(benOk);const all=bs.length?bs:byKey[l.k];
  return `<div class="pop"><h4>${esc(l.n)}</h4>`+
  all.map(b=>`<div class="b"><span class="dto">${esc(b.corto||b.beneficio)}</span><span class="dia">${esc(b.dias||daysTxt(b))}</span>${(b.tags||[]).filter(t=>/Black|Mastercard/i.test(t)).map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</div>`).join('')+
  `<div class="foot"><span>${esc(l.c)}</span><a href="${gmaps(l)}" target="_blank" rel="noopener">Cómo llegar</a></div></div>`}
locs.forEach(l=>markers[l.id]=mk(l));
let lastIds='';
function render(){
  st.q=norm($('q').value.trim());
  const benPass=locs.filter(l=>byKey[l.k].some(benOk));
  // cascading geo options
  const zonas=[...new Set(benPass.map(l=>l.z))].sort();
  opts($('fZona'),zonas,st.zona,'Todas');
  const regs=D.regions.filter(r=>benPass.some(l=>l.r===r&&geoOk(l,'reg')));
  opts($('fReg'),regs,st.reg,'Todas');
  opts($('fCiu'),[...new Set(benPass.filter(l=>geoOk(l,'ciu')).map(l=>l.ci))].sort((a,b)=>a.localeCompare(b,'es')),st.ciu,'Todas');
  opts($('fCom'),[...new Set(benPass.filter(l=>geoOk(l,'com')).map(l=>l.c))].sort((a,b)=>a.localeCompare(b,'es')),st.com,'Todas');
  const geo=benPass.filter(l=>geoOk(l)&&textOk(l));
  opts($('fCo'),[...new Set(geo.map(l=>l.n))].sort((a,b)=>a.localeCompare(b,'es')),st.co,'Todos');
  const vis=geo.filter(l=>!st.co||l.n===st.co);
  const ids=vis.map(l=>l.id).join(',');
  if(ids!==lastIds){cluster.clearLayers();cluster.addLayers(vis.map(l=>markers[l.id]));lastIds=ids;
    if(vis.length&&(st.reg||st.ciu||st.com||st.co||st.q||st.zona)){const b=L.latLngBounds(vis.map(l=>[l.lat,l.lon]));map.fitBounds(b.pad(.15),{maxZoom:15})}}
  // list
  let arr=vis.slice();
  if(st.me){arr.forEach(l=>l.km=km(st.me,l));arr.sort((a,b)=>a.km-b.km)}
  else arr.sort((a,b)=>a.n.localeCompare(b.n,'es')||a.c.localeCompare(b.c,'es'));
  const merch=new Set(vis.map(l=>l.k)).size;
  $('count').textContent=`${vis.length.toLocaleString('es-CL')} sucursales · ${merch} comercios`;
  $('listTitle').textContent=st.me?'Cercano':'Sucursales';
  const html=arr.slice(0,st.limit).map(l=>{const bs=byKey[l.k].filter(benOk);const b=bs[0]||byKey[l.k][0];const tday=b.d.includes(todayIdx);
    const tags=[...new Set(bs.flatMap(x=>x.tags||[]))];
    return `<div class="item${st.sel===l.id?' active':''}" data-id="${l.id}" tabindex="0"><div class="badge" style="background:${catColor(l.cat)}">${esc(initials(l.n))}</div>
      <h3>${esc(l.n)}</h3><div class="addr">${esc(l.a)}, ${esc(l.c)}${st.me?` · <span class="dist">${l.km<10?l.km.toFixed(1):Math.round(l.km)} km</span>`:''}</div>
      <div class="meta"><span class="pill">${esc(b.corto||b.beneficio)}</span>${bs.length>1?`<span class="tag">+${bs.length-1} beneficio${bs.length>2?'s':''}</span>`:''}<span class="tag${tday?' today':''}">${esc(b.dias||daysTxt(b))}</span>${tags.map(t=>`<span class="tag${t==='Black'?' black':''}">${esc(t)}</span>`).join('')}</div></div>`}).join('');
  $('items').innerHTML=(html||'<div class="empty">No hay sucursales con estos filtros. Prueba quitando el día o la comuna, o revisa los beneficios online.</div>')+
    (arr.length>st.limit?`<div class="more"><button id="moreBtn">Mostrar ${Math.min(60,arr.length-st.limit)} más (de ${arr.length})</button></div>`:'');
  const mb=$('moreBtn');if(mb)mb.onclick=()=>{st.limit+=60;render()};
  renderOnline();
}
function renderOnline(){
  const list=online.filter(benOk).filter(b=>!st.q||norm(b.comercio+' '+b.beneficio+' '+b.descripcion).includes(st.q));
  $('nOnline').textContent=list.length;
  $('oSub').textContent=`${list.length} beneficios que se usan en web, app o en todo Chile`;
  const groups={};list.forEach(b=>(groups[b.categoria]=groups[b.categoria]||[]).push(b));
  $('oItems').innerHTML=CATS.filter(c=>groups[c[0]]).map(([c])=>`<div class="cat-h">${esc(c)}</div>`+groups[c].map(b=>`<div class="ocard"><div class="row"><h3>${esc(b.comercio)}</h3><span class="pill">${esc(b.beneficio)}</span></div>
    <div class="row" style="margin-top:4px"><span class="tag${b.d.includes(todayIdx)?' today':''}">${esc(daysTxt(b))}</span>${(b.tags||[]).map(t=>`<span class="tag${t==='Black'?' black':''}">${esc(t)}</span>`).join('')}${b.fisico?'<span class="tag">También en tienda</span>':''}</div>
    <p class="desc">${esc(b.descripcion)}</p>${b.codigo?`<p class="desc">Código: <span class="code">${esc(b.codigo)}</span></p>`:''}${b.web&&/^https?:/.test(b.web)?`<a href="${esc(b.web)}" target="_blank" rel="noopener">Ir al sitio →</a>`:''}</div>`).join('')).join('')||'<div class="empty">Sin beneficios online para estos filtros.</div>';
}
// events
$('items').addEventListener('click',e=>{const it=e.target.closest('.item');if(!it)return;const l=locs[+it.dataset.id];st.sel=l.id;
  document.body.classList.remove('show-list');$('btnList').textContent='Ver lista';
  cluster.zoomToShowLayer(markers[l.id],()=>markers[l.id].openPopup());document.querySelectorAll('.item.active').forEach(x=>x.classList.remove('active'));it.classList.add('active')});
$('items').addEventListener('keydown',e=>{if(e.key==='Enter'){const it=e.target.closest('.item');it&&it.click()}});
const bind=(id,k)=>$(id).addEventListener('change',e=>{st[k]=e.target.value;st.limit=60;
  if(k==='zona'){st.reg=st.ciu=st.com=''}if(k==='reg'){st.ciu=st.com=''}if(k==='ciu'){st.com=''}render()});
bind('fDia','dia');bind('fZona','zona');bind('fReg','reg');bind('fCiu','ciu');bind('fCom','com');bind('fCo','co');
let t;$('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{st.limit=60;render()},180)});
$('reset').onclick=()=>{st.cats.clear();st.progs.clear();Object.assign(st,{dia:'',zona:'',reg:'',ciu:'',com:'',co:'',q:''});$('q').value='';$('fDia').value='';
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));render();map.setView([-33.44,-70.62],11)};
const dr=$('drawer');
$('btnOnline').onclick=()=>{const o=!dr.classList.contains('open');dr.classList.toggle('open',o);$('btnOnline').setAttribute('aria-expanded',o)};
$('closeD').onclick=()=>{dr.classList.remove('open');$('btnOnline').setAttribute('aria-expanded','false')};
$('btnList').onclick=()=>{const s=document.body.classList.toggle('show-list');$('btnList').textContent=s?'Ver mapa':'Ver lista'};
let meMarker;
$('near').onclick=()=>{if(!navigator.geolocation){alert('Tu navegador no comparte ubicación.');return}
  $('near').textContent='Buscando…';
  navigator.geolocation.getCurrentPosition(p=>{st.me={lat:p.coords.latitude,lon:p.coords.longitude};$('near').textContent='📍 Cerca de mí';
    if(meMarker)meMarker.remove();meMarker=L.circleMarker([st.me.lat,st.me.lon],{radius:8,color:'#fff',weight:3,fillColor:'#1f7ac2',fillOpacity:1}).addTo(map);
    map.setView([st.me.lat,st.me.lon],14);render()},
  ()=>{$('near').textContent='📍 Cerca de mí';alert('No pudimos obtener tu ubicación. Usa los filtros de comuna o el buscador.')},{enableHighAccuracy:true,timeout:10000})};
render();
})();
</script>
